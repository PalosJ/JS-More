name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-profiles:
    name: Build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimal-runtime
            arguments: -PruntimeProfile=minimal
          - profile: default
            arguments: -PruntimeProfile=default
          - profile: aeronautics-exact
            arguments: -PruntimeProfile=aeronautics
          - profile: pack-interop
            arguments: -PruntimeProfile=pack-interop
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run complete profile gate
        run: >-
          ./gradlew test runGameTestServer assemble
          ${{ matrix.arguments }}
          --rerun-tasks --warning-mode all --console=plain

  travelers-server-smoke:
    name: Travelers ${{ matrix.travelers }} server smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        travelers: ['0.7.1', '0.7.2']
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Start GameTest dedicated server with exact Travelers binary
        run: >-
          ./gradlew runGameTestServer
          -PruntimeProfile=minimal
          -PtravelersRuntimeVersion=${{ matrix.travelers }}
          --rerun-tasks --warning-mode all --console=plain

  release-artifact:
    name: Publishing dry-run and artifact audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify publishing graph without publishing
        run: ./gradlew publish --dry-run --warning-mode all --console=plain

      - name: Audit assembled artifact
        run: ./gradlew auditReleaseArtifact --warning-mode all --console=plain
