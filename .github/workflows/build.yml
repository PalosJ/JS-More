name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-profiles:
    name: Build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: legacy-minimal
            arguments: -PupstreamProfile=legacy -PruntimeProfile=minimal -PphysicsProfile=legacy
          - profile: legacy-default
            arguments: -PupstreamProfile=legacy -PruntimeProfile=default -PphysicsProfile=legacy
          - profile: legacy-aeronautics-legacy
            arguments: -PupstreamProfile=legacy -PruntimeProfile=aeronautics -PphysicsProfile=legacy
          - profile: legacy-aeronautics-current
            arguments: -PupstreamProfile=legacy -PruntimeProfile=aeronautics -PphysicsProfile=current
          - profile: legacy-pack-interop-legacy
            arguments: -PupstreamProfile=legacy -PruntimeProfile=pack-interop -PphysicsProfile=legacy
          - profile: legacy-pack-interop-current
            arguments: -PupstreamProfile=legacy -PruntimeProfile=pack-interop -PphysicsProfile=current
          - profile: legacy-minimal-neo-21.1.250
            arguments: -PupstreamProfile=legacy -PruntimeProfile=minimal -Pneo_version=21.1.250
          - profile: current-minimal
            arguments: -PupstreamProfile=current -PruntimeProfile=minimal -PphysicsProfile=current
          - profile: current-default
            arguments: -PupstreamProfile=current -PruntimeProfile=default -PphysicsProfile=current
          - profile: current-aeronautics-legacy
            arguments: -PupstreamProfile=current -PruntimeProfile=aeronautics -PphysicsProfile=legacy
          - profile: current-aeronautics-current
            arguments: -PupstreamProfile=current -PruntimeProfile=aeronautics -PphysicsProfile=current
          - profile: current-pack-interop-legacy
            arguments: -PupstreamProfile=current -PruntimeProfile=pack-interop -PphysicsProfile=legacy
          - profile: current-pack-interop-current
            arguments: -PupstreamProfile=current -PruntimeProfile=pack-interop -PphysicsProfile=current
          - profile: current-minimal-neo-21.1.250
            arguments: -PupstreamProfile=current -PruntimeProfile=minimal -Pneo_version=21.1.250
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run complete profile gate
        run: >-
          ./gradlew test runGameTestServer assemble
          ${{ matrix.arguments }}
          --rerun-tasks --warning-mode all --console=plain

  travelers-server-smoke:
    name: Travelers ${{ matrix.travelers }} server smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        travelers: ['0.7.1']
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Start GameTest dedicated server with exact Travelers binary
        run: >-
          ./gradlew runGameTestServer
          -PruntimeProfile=minimal -PupstreamProfile=legacy
          -PtravelersRuntimeVersion=${{ matrix.travelers }}
          --rerun-tasks --warning-mode all --console=plain

  release-artifact:
    name: Publishing dry-run and artifact audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify publishing graph without publishing
        run: ./gradlew publish --dry-run --warning-mode all --console=plain

      - name: Audit assembled artifact
        run: ./gradlew auditReleaseArtifact --warning-mode all --console=plain
