def serverRunClasspathProvider = tasks.named("runServer").get().classpathProvider
def orderedServerRunClasspathProvider = providers.provider {
    serverRunClasspathProvider.asPath
            .split(java.util.regex.Pattern.quote(File.pathSeparator), -1)
            .findAll { !it.isEmpty() }
            .collect { new File(it).absoluteFile.toPath().normalize().toString() }
}
def nativeArgumentFileEncoding = providers.provider {
    System.getProperty("native.encoding", java.nio.charset.Charset.defaultCharset().name())
}
def writeServerRunClasspathArgumentFile = tasks.register("writeServerRunClasspathArgumentFile", WriteRunClasspathArgumentFile) {
    runClasspath.from(serverRunClasspathProvider)
    orderedAbsoluteClasspath.set(orderedServerRunClasspathProvider)
    outputFile.set(layout.buildDirectory.file("moddev/serverRunClasspath.txt"))
    argumentFileEncoding.set(nativeArgumentFileEncoding)
}

def javaArgumentFileFixtureRoot = providers.gradleProperty("javaArgumentFileFixtureRoot")
        .map { new File(it).absoluteFile.toPath().normalize().toString() }
        .orElse(layout.buildDirectory.dir("verification/java argfile/非ASCII fixture").map {
            it.asFile.absoluteFile.toPath().normalize().toString()
        })
def javaArgumentFileFixtureClasspath = javaArgumentFileFixtureRoot.map { root ->
    [new File(root, "第一 classpath entry").absolutePath, new File(root, "第二 classpath entry").absolutePath]
}
def writeJavaArgumentFileFixture = tasks.register("writeJavaArgumentFileFixture", WriteRunClasspathArgumentFile) {
    orderedAbsoluteClasspath.set(javaArgumentFileFixtureClasspath)
    outputFile.set(layout.buildDirectory.file("verification/java-argument-file-fixture.txt"))
    argumentFileEncoding.set(nativeArgumentFileEncoding)
}
def verifyJavaArgumentFileInfrastructure = tasks.register("verifyJavaArgumentFileInfrastructure", VerifyJavaArgumentFileInfrastructure) {
    dependsOn writeJavaArgumentFileFixture
    orderedAbsoluteClasspath.set(javaArgumentFileFixtureClasspath)
    argumentFile.set(writeJavaArgumentFileFixture.flatMap { it.outputFile })
    argumentFileEncoding.set(nativeArgumentFileEncoding)
}

def verifyTravelersRuntimeClasspath = tasks.register("verifyTravelersRuntimeClasspath", VerifyTravelersRuntimeClasspath) {
    dependsOn writeServerRunClasspathArgumentFile
    runtimeClasspath.from(configurations.runtimeClasspath)
    testRuntimeClasspath.from(configurations.testRuntimeClasspath)
    compileClasspath.from(configurations.compileClasspath)
    serverRunClasspath.from(serverRunClasspathProvider)
    serverRunClasspathArgumentFile.set(writeServerRunClasspathArgumentFile.flatMap { it.outputFile })
    orderedAbsoluteServerRunClasspath.set(orderedServerRunClasspathProvider)
    argumentFileEncoding.set(nativeArgumentFileEncoding)
    expectedRuntimeVersion.set(travelersRuntimeVersion)
    expectedCompileVersion.set(travelerslib_version.toString())
}

["prepareServerRun", "prepareGameTestServerRun"].each { taskName ->
    tasks.named(taskName).configure { dependsOn verifyTravelersRuntimeClasspath }
}
tasks.named("test").configure {
    dependsOn verifyTravelersRuntimeClasspath, verifyJavaArgumentFileInfrastructure
}

