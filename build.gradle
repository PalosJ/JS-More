def testClasspathJarDirectory = new File(
        gradle.gradleUserHomeDir,
        "jsmore/test-classpath/${Integer.toHexString(rootDir.absolutePath.hashCode())}"
)
def testClasspathJar = tasks.register("testClasspathJar", Jar) {
    dependsOn tasks.named("testClasses")
    archiveFileName = "jsmore-test-classpath.jar"
    destinationDirectory = testClasspathJarDirectory
    inputs.property(
            "classpathEntries",
            { testRuntimeFiles.files.collect { it.toURI().toASCIIString() } }
    )
    doFirst {
        manifest.attributes(
                "Class-Path": testRuntimeFiles.files.collect { it.toURI().toASCIIString() }.join(" ")
        )
    }
}
tasks.named("test", Test).configure {
    dependsOn testClasspathJar
    classpath = files(testClasspathJar.flatMap { it.archiveFile })
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_author             : mod_author,
            credits                : credits,
            // Use a dedicated property name to avoid colliding with Gradle's built-in project/task description field.
            mod_description        : project.property("mod_description"),
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

def pomJurassicSagaVersion = project.property("jurassicsaga_version").toString()
def pomTravelersVersion = project.property("travelerslib_version").toString()

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
            pom {
                name = mod_name
                description = project.property("mod_description")
                url = project.property("project_url")
                licenses {
                    license {
                        name = "MIT"
                        url = "${project.property('project_url')}/blob/main/LICENSES/MIT.txt"
                        distribution = "repo"
                        comments = "Applies to code, tests, build files, ordinary data, language files, and documentation."
                    }
                    license {
                        name = "LicenseRef-JSMore-Visual-Assets"
                        url = "${project.property('project_url')}/blob/main/LICENSES/LicenseRef-JSMore-Visual-Assets.txt"
                        distribution = "repo"
                        comments = "Applies only to original visual assets identified by the project provenance ledger."
                    }
                }
                developers {
                    developer {
                        id = "Palos"
                        name = "Palos"
                    }
                }
                scm {
                    connection = "scm:git:${project.property('project_scm_url')}"
                    developerConnection = "scm:git:${project.property('project_scm_url')}"
                    url = project.property("project_url")
                }
                issueManagement {
                    system = "GitHub Issues"
                    url = project.property("project_issues_url")
                }
            }
            pom.withXml {
                def root = asNode()
                root.children().removeAll { child ->
                    if (!(child instanceof groovy.util.Node)) {
                        return false
                    }
                    def childName = child.name()
                    return (childName instanceof groovy.namespace.QName
                            ? childName.localPart
                            : childName.toString()) == "dependencies"
                }
                def dependenciesNode = root.appendNode("dependencies")
                [
                        ["maven.modrinth", "jurassic-saga", pomJurassicSagaVersion],
                        ["maven.modrinth", "travelers-lib", pomTravelersVersion]
                ].each { dependency ->
                    def dependencyNode = dependenciesNode.appendNode("dependency")
                    dependencyNode.appendNode("groupId", dependency[0])
                    dependencyNode.appendNode("artifactId", dependency[1])
                    dependencyNode.appendNode("version", dependency[2])
                    dependencyNode.appendNode("scope", "runtime")
                }
            }
        }
    }
    repositories {
        maven {
            url = file("repo").toURI()
        }
    }
}

