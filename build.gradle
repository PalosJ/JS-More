import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.tasks.InputFiles
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.process.CommandLineArgumentProvider

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

def withAeronauticsPackInterop = providers.gradleProperty("withAeronauticsPackInterop")
        .map { it.toBoolean() }
        .getOrElse(false)
def withAeronautics = withAeronauticsPackInterop || providers.gradleProperty("withAeronautics")
        .map { it.toBoolean() }
        .getOrElse(false)
def aeronauticsExpectedStatus = withAeronautics ? "READY" : "ABSENT"

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/.cache/**") // datagen cache files
}

repositories {
    maven {
        name = "TencentMirror"
        url = "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/"
    }
    maven {
        name = "MinecraftForge"
        url = "https://maven.minecraftforge.net/"
    }
    maven {
        name = "Collinvht Releases"
        url = "https://maven.collinvht.nl/releases"
    }
    maven {
        name = "Collinvht Snapshots"
        url = "https://maven.collinvht.nl/snapshots"
    }
    maven {
        name = "Illusive Soulworks"
        url = "https://maven.theillusivec4.top/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "RyanHCode Releases"
                url = "https://maven.ryanhcode.dev/releases"
            }
        }
        filter {
            includeGroup("dev.ryanhcode.sable-companion")
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.simulated_team.simulated")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Create Releases"
                url = "https://maven.createmod.net"
            }
        }
        filter {
            includeGroup("com.simibubi.create")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'jsrevise.test.aeronautics.expected-status', aeronauticsExpectedStatus
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    testRuntimeClasspath.extendsFrom localRuntime

    aeronauticsBundleBinary {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    sableBinary {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    createBinary {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    dieselGeneratorsBinary {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    enchantmentIndustryBinary {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    dragonsPlusBinary {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def sableCompanionModule = "dev.ryanhcode.sable-companion:sable-companion-common-1.21.1"

abstract class AeronauticsBinaryArgumentProvider implements CommandLineArgumentProvider {
    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getAeronauticsBundle()

    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getSable()

    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getCreate()

    @Override
    Iterable<String> asArguments() {
        return [
                "-Djsrevise.test.aeronautics.bundle.jar=${aeronauticsBundle.singleFile.absolutePath}",
                "-Djsrevise.test.sable.jar=${sable.singleFile.absolutePath}",
                "-Djsrevise.test.create.jar=${create.singleFile.absolutePath}"
        ]
    }
}

abstract class AeronauticsInteropBinaryArgumentProvider implements CommandLineArgumentProvider {
    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getDieselGenerators()

    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getEnchantmentIndustry()

    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getDragonsPlus()

    @Override
    Iterable<String> asArguments() {
        return [
                "-Djsrevise.test.aeronautics.diesel-generators.jar=${dieselGenerators.singleFile.absolutePath}",
                "-Djsrevise.test.aeronautics.enchantment-industry.jar=${enchantmentIndustry.singleFile.absolutePath}",
                "-Djsrevise.test.aeronautics.dragons-plus.jar=${dragonsPlus.singleFile.absolutePath}"
        ]
    }
}

dependencies {
    compileOnly "maven.modrinth:travelers-lib:${travelerslib_version}"
    localRuntime "maven.modrinth:travelers-lib:${travelerslib_version}"

    implementation "maven.modrinth:jurassic-saga:${jurassicsaga_version}"
    localRuntime "com.github.glitchfiend:TerraBlender-neoforge:1.21.1-4.1.0.8"

    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}"

    compileOnly "maven.modrinth:jade:15.10.5+neoforge"

    jarJar(compileOnly("${sableCompanionModule}:1.6.0")) {
        version {
            strictly "[1.6.0,1.6.1)"
            prefer "1.6.0"
        }
    }
    if (!withAeronautics) {
        additionalRuntimeClasspath "${sableCompanionModule}:1.6.0"
    }

    compileOnly("dev.simulated_team.simulated:simulated-neoforge-1.21.1:1.3.0") {
        transitive = false
    }
    compileOnly("dev.ryanhcode.sable:sable-neoforge-1.21.1:2.0.3") {
        transitive = false
    }
    compileOnly("com.simibubi.create:create-1.21.1:6.0.10-280") {
        transitive = false
    }

    aeronauticsBundleBinary "maven.modrinth:oWaK0Q19:w7zlLnea"
    sableBinary "maven.modrinth:T9PomCSv:1L6XJqnY"
    createBinary "maven.modrinth:LNytGWDc:UjX6dr61"
    dieselGeneratorsBinary "maven.modrinth:ZM3tt6p1:Kijd1iDy"
    enchantmentIndustryBinary "maven.modrinth:JWGBpFUP:8XedJhwv"
    dragonsPlusBinary "maven.modrinth:dzb1a5WV:lSnZyFnZ"

    if (withAeronautics) {
        localRuntime("maven.modrinth:oWaK0Q19:w7zlLnea") {
            transitive = false
        }
        localRuntime("maven.modrinth:T9PomCSv:1L6XJqnY") {
            transitive = false
        }
        localRuntime("maven.modrinth:LNytGWDc:UjX6dr61") {
            transitive = false
        }
        if (withAeronauticsPackInterop) {
            localRuntime("maven.modrinth:ZM3tt6p1:Kijd1iDy") {
                transitive = false
            }
            localRuntime("maven.modrinth:JWGBpFUP:8XedJhwv") {
                transitive = false
            }
            localRuntime("maven.modrinth:dzb1a5WV:lSnZyFnZ") {
                transitive = false
            }
        }
    }

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation("${sableCompanionModule}:1.6.0") {
        transitive = false
    }
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def aeronauticsBinaryArguments = objects.newInstance(AeronauticsBinaryArgumentProvider)
aeronauticsBinaryArguments.aeronauticsBundle.from(configurations.aeronauticsBundleBinary)
aeronauticsBinaryArguments.sable.from(configurations.sableBinary)
aeronauticsBinaryArguments.create.from(configurations.createBinary)

def aeronauticsInteropBinaryArguments = objects.newInstance(AeronauticsInteropBinaryArgumentProvider)
aeronauticsInteropBinaryArguments.dieselGenerators.from(configurations.dieselGeneratorsBinary)
aeronauticsInteropBinaryArguments.enchantmentIndustry.from(configurations.enchantmentIndustryBinary)
aeronauticsInteropBinaryArguments.dragonsPlus.from(configurations.dragonsPlusBinary)

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgumentProviders.add(aeronauticsBinaryArguments)
    systemProperty 'jsrevise.test.aeronautics.expected-status', aeronauticsExpectedStatus
    if (withAeronauticsPackInterop) {
        jvmArgumentProviders.add(aeronauticsInteropBinaryArguments)
    }
}

if (withAeronautics) {
    neoForge.runs.gameTestServer {
        systemProperty 'jsrevise.test.aeronautics.bundle.jar', configurations.aeronauticsBundleBinary.singleFile.absolutePath
        systemProperty 'jsrevise.test.sable.jar', configurations.sableBinary.singleFile.absolutePath
        systemProperty 'jsrevise.test.create.jar', configurations.createBinary.singleFile.absolutePath
        if (withAeronauticsPackInterop) {
            systemProperty 'jsrevise.test.aeronautics.diesel-generators.jar', configurations.dieselGeneratorsBinary.singleFile.absolutePath
            systemProperty 'jsrevise.test.aeronautics.enchantment-industry.jar', configurations.enchantmentIndustryBinary.singleFile.absolutePath
            systemProperty 'jsrevise.test.aeronautics.dragons-plus.jar', configurations.dragonsPlusBinary.singleFile.absolutePath
        }
    }
}

def aeronauticsRuntimeFiles = files(
        configurations.aeronauticsBundleBinary,
        configurations.sableBinary,
        configurations.createBinary
)
if (withAeronauticsPackInterop) {
    aeronauticsRuntimeFiles = files(
            aeronauticsRuntimeFiles,
            configurations.dieselGeneratorsBinary,
            configurations.enchantmentIndustryBinary,
            configurations.dragonsPlusBinary
    )
}
def testRuntimeFiles = sourceSets.test.runtimeClasspath - aeronauticsRuntimeFiles
def testClasspathJarDirectory = new File(
        gradle.gradleUserHomeDir,
        "jsrevise/test-classpath/${Integer.toHexString(rootDir.absolutePath.hashCode())}"
)
def testClasspathJar = tasks.register("testClasspathJar", Jar) {
    dependsOn tasks.named("testClasses")
    archiveFileName = "jsrevise-test-classpath.jar"
    destinationDirectory = testClasspathJarDirectory
    inputs.property(
            "classpathEntries",
            { testRuntimeFiles.files.collect { it.toURI().toASCIIString() } }
    )
    doFirst {
        manifest.attributes(
                "Class-Path": testRuntimeFiles.files.collect { it.toURI().toASCIIString() }.join(" ")
        )
    }
}
tasks.named("test", Test).configure {
    dependsOn testClasspathJar
    classpath = files(testClasspathJar.flatMap { it.archiveFile })
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_author             : mod_author,
            credits                : credits,
            // Use a dedicated property name to avoid colliding with Gradle's built-in project/task description field.
            mod_description        : project.property("mod_description"),
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = file("repo").toURI()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
