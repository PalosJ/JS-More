final class Java21ArgumentFileCodec {
    private Java21ArgumentFileCodec() {
    }

    static String serializeClasspath(List<String> orderedAbsoluteClasspath) {
        if (!orderedAbsoluteClasspath) {
            throw new GradleException("A Java classpath argument file requires at least one entry")
        }
        if (orderedAbsoluteClasspath.any { !it || !new File(it).isAbsolute() }) {
            throw new GradleException("Java classpath entries must be non-empty absolute paths: ${orderedAbsoluteClasspath}")
        }
        return "-classpath\n${quoteToken(orderedAbsoluteClasspath.join(File.pathSeparator))}\n"
    }

    static String quoteToken(String value) {
        if (value == null) {
            throw new GradleException("Java argument tokens cannot be null")
        }
        StringBuilder escaped = new StringBuilder(value.length() + 2).append('"')
        for (int index = 0; index < value.length(); index++) {
            char character = value.charAt(index)
            switch (character) {
                case '\\': escaped.append("\\\\"); break
                case '"': escaped.append("\\\""); break
                case '\n': escaped.append("\\n"); break
                case '\r': escaped.append("\\r"); break
                case '\t': escaped.append("\\t"); break
                case '\f': escaped.append("\\f"); break
                default:
                    if (Character.isISOControl(character)) {
                        throw new GradleException("Unsupported control character U+${String.format('%04X', (int) character)} in Java argument")
                    }
                    escaped.append(character)
            }
        }
        return escaped.append('"').toString()
    }
}

abstract class WriteRunClasspathArgumentFile extends DefaultTask {
    @Classpath abstract ConfigurableFileCollection getRunClasspath()
    @Input abstract ListProperty<String> getOrderedAbsoluteClasspath()
    @OutputFile abstract RegularFileProperty getOutputFile()
    @Input abstract Property<String> getArgumentFileEncoding()

    @TaskAction
    void writeRunClasspathArgumentFile() {
        File output = outputFile.get().asFile
        output.parentFile.mkdirs()
        String contents = Java21ArgumentFileCodec.serializeClasspath(orderedAbsoluteClasspath.get())
        output.setText(contents, argumentFileEncoding.get())
    }
}

abstract class VerifyJavaArgumentFileInfrastructure extends DefaultTask {
    @Input abstract ListProperty<String> getOrderedAbsoluteClasspath()
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getArgumentFile()
    @Input abstract Property<String> getArgumentFileEncoding()

    @TaskAction
    void verifyJavaArgumentFileInfrastructure() {
        List<String> classpath = orderedAbsoluteClasspath.get()
        String expected = Java21ArgumentFileCodec.serializeClasspath(classpath)
        String actual = argumentFile.get().asFile.getText(argumentFileEncoding.get())
        if (actual != expected) {
            throw new GradleException("Generated Java classpath argument file does not match its ordered path input")
        }

        String special = "slash\\quote\"line\ncarriage\rtab\tform\f"
        String expectedSpecial = "\"slash\\\\quote\\\"line\\ncarriage\\rtab\\tform\\f\""
        if (Java21ArgumentFileCodec.quoteToken(special) != expectedSpecial) {
            throw new GradleException("Java argument escaping does not preserve backslashes, quotes, and controls")
        }
        try {
            Java21ArgumentFileCodec.quoteToken("unsupported\u0000control")
            throw new GradleException("Java argument escaping accepted an unsupported control character")
        } catch (GradleException exception) {
            if (!exception.message.startsWith("Unsupported control character")) {
                throw exception
            }
        }

        String executable = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")
                ? "java.exe"
                : "java"
        File javaExecutable = new File(new File(System.getProperty("java.home"), "bin"), executable)
        File launcherOutput = new File(temporaryDir, "java-launcher-output.txt")
        Process process = new ProcessBuilder(
                javaExecutable.absolutePath,
                "@${argumentFile.get().asFile.absolutePath}",
                "-XshowSettings:properties",
                "-version"
        ).redirectErrorStream(true).redirectOutput(launcherOutput).start()
        if (!process.waitFor(30L, java.util.concurrent.TimeUnit.SECONDS)) {
            process.destroyForcibly()
            throw new GradleException("Java argument-file smoke timed out")
        }
        String output = launcherOutput.getText(argumentFileEncoding.get())
        int classpathCursor = output.indexOf("java.class.path = ")
        boolean orderedClasspathVisible = classpathCursor >= 0
        classpath.each { entry ->
            int entryIndex = orderedClasspathVisible ? output.indexOf(entry, classpathCursor) : -1
            orderedClasspathVisible &= entryIndex >= classpathCursor
            classpathCursor = Math.max(classpathCursor, entryIndex + entry.length())
        }
        if (process.exitValue() != 0
                || !orderedClasspathVisible
                || !output.toLowerCase(Locale.ROOT).contains("version")) {
            throw new GradleException(
                    "Java argument-file smoke failed with exit ${process.exitValue()}: ${output}"
            )
        }
        logger.lifecycle("Verified Java argument-file serialization with a real Java launcher")
    }
}

abstract class VerifyTravelersRuntimeClasspath extends DefaultTask {
    @Classpath abstract ConfigurableFileCollection getRuntimeClasspath()
    @Classpath abstract ConfigurableFileCollection getTestRuntimeClasspath()
    @Classpath abstract ConfigurableFileCollection getCompileClasspath()
    @Classpath abstract ConfigurableFileCollection getServerRunClasspath()
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getServerRunClasspathArgumentFile()
    @Input abstract ListProperty<String> getOrderedAbsoluteServerRunClasspath()
    @Input abstract Property<String> getArgumentFileEncoding()
    @Input abstract Property<String> getExpectedRuntimeVersion()
    @Input abstract Property<String> getExpectedCompileVersion()

    @TaskAction
    void verifyTravelersRuntimeClasspath() {
        verifyClasspath("runtimeClasspath", runtimeClasspath.files, expectedRuntimeVersion.get())
        verifyClasspath("testRuntimeClasspath", testRuntimeClasspath.files, expectedRuntimeVersion.get())
        verifyClasspath("compileClasspath", compileClasspath.files, expectedCompileVersion.get())
        verifyClasspath("runServer.classpathProvider", serverRunClasspath.files, expectedRuntimeVersion.get())
        verifyArgumentFile(
                serverRunClasspathArgumentFile.get().asFile,
                orderedAbsoluteServerRunClasspath.get(),
                expectedRuntimeVersion.get(),
                argumentFileEncoding.get()
        )
        logger.lifecycle(
                "Verified Travelers runtime {} with compile baseline {} and generated server launch classpath",
                expectedRuntimeVersion.get(),
                expectedCompileVersion.get()
        )
    }

    private static void verifyClasspath(String name, Set<File> files, String expectedVersion) {
        def travelers = files.findAll { file ->
            file.name.startsWith("travelers-lib-") && file.name.endsWith(".jar")
        }
        String expectedName = "travelers-lib-${expectedVersion}.jar"
        if (travelers.size() != 1 || travelers[0].name != expectedName) {
            throw new GradleException("${name} must contain exactly ${expectedName}; resolved ${travelers*.absolutePath}")
        }
    }

    private static void verifyArgumentFile(
            File argumentFile,
            List<String> orderedAbsoluteClasspath,
            String expectedVersion,
            String encoding
    ) {
        String contents = argumentFile.getText(encoding)
        String expectedContents = Java21ArgumentFileCodec.serializeClasspath(orderedAbsoluteClasspath)
        if (contents != expectedContents) {
            throw new GradleException("${argumentFile} does not exactly match the current ordered runServer classpath")
        }

        def travelers = contents.findAll(/travelers-lib-[0-9]+(?:\.[0-9]+)+\.jar/)
        String expectedName = "travelers-lib-${expectedVersion}.jar"
        if (travelers.size() != 1 || travelers[0] != expectedName) {
            throw new GradleException("${argumentFile} must contain exactly ${expectedName}; found ${travelers}")
        }
    }
}

