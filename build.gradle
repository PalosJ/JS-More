def auditedReleaseArtifact = layout.buildDirectory.file("libs/${mod_id}-${mod_version}.jar")
def generatedReleasePom = layout.buildDirectory.file("publications/mavenJava/pom-default.xml")
def releaseModId = project.property("mod_id").toString()
def releaseModName = project.property("mod_name").toString()
def releaseModVersion = project.property("mod_version").toString()
def releaseModGroup = project.property("mod_group_id").toString()
def releaseModLicense = project.property("mod_license").toString()
def releaseProjectUrl = project.property("project_url").toString()
tasks.register("auditReleaseArtifact") {
    group = "verification"
    description = "Audits the assembled JAR and POM for release identity, licenses, resources, and dependency leakage."
    dependsOn tasks.named("assemble"), tasks.named("generatePomFileForMavenJavaPublication")
    inputs.file(auditedReleaseArtifact)
    inputs.file(generatedReleasePom)
    doLast {
        File artifact = auditedReleaseArtifact.get().asFile
        if (!artifact.isFile()) {
            throw new GradleException("Expected release artifact is missing: ${artifact}")
        }
        if (artifact.name != "${releaseModId}-${releaseModVersion}.jar") {
            throw new GradleException("Unexpected release artifact identity: ${artifact.name}")
        }
        def zip = new java.util.zip.ZipFile(artifact)
        try {
            def entries = zip.entries().collect { it.name }
            def nested = entries.findAll { it.startsWith("META-INF/jarjar/") && it.endsWith(".jar") }
            if (nested.size() != 1 || !nested[0].contains("sable-companion-common")) {
                throw new GradleException("Unexpected nested JAR set: ${nested}")
            }
            def bannedPrefixes = [
                    "dev/simulated_team/simulated/",
                    "dev/ryanhcode/sable/api/",
                    "com/simibubi/create/",
                    "terrablender/",
                    "top/theillusivec4/curios/",
                    "snownee/jade/",
                    "org/azurelib/"
            ]
            def leaked = entries.findAll { entry -> bannedPrefixes.any { entry.startsWith(it) } }
            if (!leaked.isEmpty()) {
                throw new GradleException("Optional or external dependency classes leaked into the JAR: ${leaked.take(20)}")
            }
            [
                    "META-INF/neoforge.mods.toml",
                    "LICENSE",
                    "LICENSES/MIT.txt",
                    "LICENSES/LicenseRef-JSMore-Visual-Assets.txt",
                    "LICENSES/NeoForge-MDK-MIT.txt",
                    "THIRD_PARTY_NOTICES.md",
                    "ASSET_PROVENANCE.md",
                    "jsmore.png",
                    "data/jsmore/advancement/root.json",
                    "data/jsmore/advancement/acquire_anesthetic_potion.json",
                    "data/jsmore/advancement/transport_ready.json",
                    "data/jsmore/advancement/recipes/anesthetic_crossbow.json",
                    "data/jsmore/advancement/recipes/anesthetic_dart.json",
                    "data/jsmore/advancement/recipes/anesthetic_syringe.json",
                    "data/jsmore/advancement/recipes/dino_doctor_goggles.json",
                    "data/jsmore/advancement/recipes/dinosaur_capture_box.json"
            ].each { required ->
                if (!entries.contains(required)) {
                    throw new GradleException("Release artifact is missing ${required}")
                }
            }

            def metadataEntry = zip.getEntry("META-INF/neoforge.mods.toml")
            def metadata = zip.getInputStream(metadataEntry).getText("UTF-8")
            [
                    "modId=\"${releaseModId}\"",
                    "version=\"${releaseModVersion}\"",
                    "displayName=\"${releaseModName}\"",
                    'logoFile="jsmore.png"',
                    "license=\"${releaseModLicense}\"",
                    'versionRange="[0.2.1,)"',
                    'versionRange="[0.7.1,)"'
            ].each { expected ->
                if (!metadata.contains(expected)) {
                    throw new GradleException("Generated metadata is missing ${expected}")
                }
            }

            def oldTechnicalIdentity = [
                    "js" + "revise",
                    "js" + "-revise",
                    "js" + " revise",
                    "js" + "_revise"
            ]
            def containsOldTechnicalIdentity = { value ->
                def normalized = value.toString().toLowerCase(Locale.ROOT)
                oldTechnicalIdentity.any { oldIdentity -> normalized.contains(oldIdentity) }
            }
            if (!containsOldTechnicalIdentity("constant-pool:" + "JS" + "REVISE")) {
                throw new GradleException("Old technical identity audit is not case-insensitive")
            }
            def oldIdentityPaths = entries.findAll { entry ->
                containsOldTechnicalIdentity(entry)
            }
            if (!oldIdentityPaths.isEmpty()) {
                throw new GradleException("Old technical identity remains in JAR paths: ${oldIdentityPaths.take(20)}")
            }
            def oldIdentityContent = []
            zip.entries().each { entry ->
                if (entry.directory || (entry.name.startsWith("META-INF/jarjar/") && entry.name.endsWith(".jar"))) {
                    return
                }
                def content = new String(zip.getInputStream(entry).readAllBytes(), java.nio.charset.StandardCharsets.ISO_8859_1)
                if (containsOldTechnicalIdentity(content)) {
                    oldIdentityContent.add(entry.name)
                }
            }
            if (!oldIdentityContent.isEmpty()) {
                throw new GradleException("Old technical identity remains in JAR content: ${oldIdentityContent.take(20)}")
            }
        } finally {
            zip.close()
        }

        File pom = generatedReleasePom.get().asFile
        if (!pom.isFile()) {
            throw new GradleException("Generated Maven POM is missing: ${pom}")
        }
        String pomText = pom.getText("UTF-8")
        [
                "<groupId>${releaseModGroup}</groupId>",
                "<artifactId>${releaseModId}</artifactId>",
                "<version>${releaseModVersion}</version>",
                "<name>${releaseModName}</name>",
                "<url>${releaseProjectUrl}</url>",
                "<name>MIT</name>",
                "<name>LicenseRef-JSMore-Visual-Assets</name>",
                "<artifactId>jurassic-saga</artifactId>",
                "<artifactId>travelers-lib</artifactId>"
        ].each { expected ->
            if (!pomText.contains(expected)) {
                throw new GradleException("Generated Maven POM is missing ${expected}")
            }
        }
        ["curios", "jade", "terrablender", "sable", "simulated", "create"].each { optionalDependency ->
            if (pomText.toLowerCase(Locale.ROOT).contains("<artifactid>${optionalDependency}</artifactid>")) {
                throw new GradleException("Optional implementation leaked into the Maven POM: ${optionalDependency}")
            }
        }
    }
}

