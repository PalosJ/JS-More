plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    gradleVersion = '9.2.1'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = '72f44c9f8ebcb1af43838f45ee5c4aa9c5444898b3468ab3f4af7b6076c5bc3f'
}

version = mod_version
group = mod_group_id

def requestedRuntimeProfile = providers.gradleProperty("runtimeProfile")
        .map { it.trim().toLowerCase(Locale.ROOT) }
        .getOrElse("default")
def supportedRuntimeProfiles = ["minimal", "default", "aeronautics", "pack-interop"] as Set
if (!supportedRuntimeProfiles.contains(requestedRuntimeProfile)) {
    throw new GradleException(
            "Unsupported runtimeProfile '${requestedRuntimeProfile}'; expected one of ${supportedRuntimeProfiles}"
    )
}
def withAeronauticsPackInterop = requestedRuntimeProfile == "pack-interop" || providers.gradleProperty("withAeronauticsPackInterop")
        .map { it.toBoolean() }
        .getOrElse(false)
def withAeronautics = requestedRuntimeProfile == "aeronautics" || withAeronauticsPackInterop || providers.gradleProperty("withAeronautics")
        .map { it.toBoolean() }
        .getOrElse(false)
def withMinimalRuntime = requestedRuntimeProfile == "minimal"
if (withMinimalRuntime && withAeronautics) {
    throw new GradleException("The minimal runtime profile cannot load Aeronautics implementations")
}
def effectiveRuntimeProfile = withAeronauticsPackInterop
        ? "pack-interop"
        : (withAeronautics ? "aeronautics" : (withMinimalRuntime ? "minimal" : "default"))
def aeronauticsExpectedStatus = withAeronautics ? "READY" : "ABSENT"
def travelersRuntimeVersion = providers.gradleProperty("travelersRuntimeVersion")
        .getOrElse(travelerslib_version)
if (!(travelersRuntimeVersion in ["0.7.1", "0.7.2"])) {
    throw new GradleException(
            "Unsupported travelersRuntimeVersion '${travelersRuntimeVersion}'; exact smoke profiles support 0.7.1 or 0.7.2"
    )
}

